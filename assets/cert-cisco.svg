  <text x="300" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle" letter-spacing="1">THIS CERTIFICATE IS AWARDED TO</text>
  
  <text x="300" y="175" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Himanshu Yadav</text>
  <line x1="180" y1="190" x2="420" y2="190" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

  <text x="300" y="225" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">FOR SUCCESSFUL COMPLETION OF</text>
  
  <text x="300" y="265" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Introduction to Cybersecurity</text>
  
  <rect x="210" y="285" width="180" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="300" y="304" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cisco Networking Academy</text>

