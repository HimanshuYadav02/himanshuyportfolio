  <text x="65" y="331" fill="#06b6d4" font-family="monospace" font-size="18" text-anchor="middle">★</text>
  <text x="100" y="330" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Verified Credential</text>

