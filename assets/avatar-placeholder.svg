<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd194"/>
      <stop offset="100%" stop-color="#d1913c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8 6"/>
  <circle cx="200" cy="180" r="125" fill="none" stroke="#00c6ff" stroke-width="1.5" opacity="0.3"/>

  <!-- Body / Shoulders -->
  <path d="M 90 360 C 90 280, 140 250, 200 250 C 260 250, 310 280, 310 360 Z" fill="#1e293b"/>
  <path d="M 120 360 C 130 300, 160 270, 200 270 C 240 270, 270 300, 280 360 Z" fill="#0f172a"/>
  
  <!-- Inner Collar / Shirt -->
  <polygon points="175,270 200,320 225,270" fill="url(#accentGrad)"/>

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="50" rx="10" fill="#e0a96d"/>

  <!-- Face -->
  <ellipse cx="200" cy="165" rx="55" ry="65" fill="#f5c28d"/>
  
  <!-- Hair (Modern textured) -->
  <path d="M 140 155 C 135 110, 160 90, 200 90 C 240 90, 265 110, 260 155 C 255 125, 245 110, 200 110 C 155 110, 145 125, 140 155 Z" fill="#1a1a24"/>
  <path d="M 145 130 Q 200 80 255 120 Q 240 95 200 95 Q 160 95 145 130 Z" fill="#2d3748"/>

  <!-- Glasses / Tech Goggles -->
  <rect x="155" y="145" width="38" height="28" rx="8" fill="#020c1b" stroke="#00c6ff" stroke-width="2.5"/>
  <rect x="207" y="145" width="38" height="28" rx="8" fill="#020c1b" stroke="#00c6ff" stroke-width="2.5"/>
  <line x1="193" y1="158" x2="207" y2="158" stroke="#00c6ff" stroke-width="3"/>
  <!-- Glasses Reflection -->
  <line x1="160" y1="150" x2="175" y2="165" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="212" y1="150" x2="227" y2="165" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Smile -->
  <path d="M 185 195 Q 200 208 215 195" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Code Tag Overlays -->
  <rect x="40" y="45" width="100" height="32" rx="16" fill="rgba(0,198,255,0.12)" stroke="#00c6ff" stroke-width="1"/>
  <text x="90" y="66" fill="#00c6ff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;dev/&gt;</text>

  <rect x="260" y="45" width="100" height="32" rx="16" fill="rgba(0,122,255,0.12)" stroke="#007aff" stroke-width="1"/>
  <text x="310" y="66" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Java • SDE</text>

  <!-- Bottom Banner note -->
  <rect x="60" y="350" width="280" height="32" rx="16" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="371" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Replace with assets/profile.jpg</text>
</svg>
